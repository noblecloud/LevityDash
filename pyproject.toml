[tool.poetry]
name = "LevityDash"
authors = ["noblecloud <git@noblecloud.dev>"]
description = "A lightweight, easy to use, desktop native, multi-source, modular dashboard for macOS, Windows and Linux"

version = "0.3.0-beta.1"
readme = "README.md"
license = "MIT"

homepage = "https://levitydash.app"
repository = "https://github.com/noblecloud/LevityDash"

keywords = ["dashboard", "desktop", "app", "weather", "dash"]
classifiers = [
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Natural Language :: English",
	"Development Status :: 4 - Beta",
	"Topic :: Utilities",
	"Topic :: Desktop Environment",
	"Environment :: Plugins",
	"Framework :: AsyncIO",
	"Framework :: aiohttp",
	"Intended Audience :: Developers",
	"Intended Audience :: End Users/Desktop",
	"Intended Audience :: Education",
	"Intended Audience :: Information Technology",
]

include = [
	'src/LevityDash/resources',
	'src/LevityDash/shims/',
]

packages = [
	{ include = 'LevityDash', from = 'src' },
	{ include = 'statekit', from = 'src' },
	{ include = 'qolkit', from = 'src' },
]

[tool.poetry.scripts]
LevityDash = 'LevityDash:__main__.main'
LevityDash-reset-config = 'LevityDash:__main__.reset_config'
LevityDash-backend = 'LevityDash.backend:main'


[tool.poetry.dependencies]
python = ">=3.13,<=3.14"
pylunar = "^0.11.1"
WeatherUnits = ">=0.7.1"
numpy = "^2.0"
pytz = ">=2023.3"
scipy = "^1.11.1"
pysolar = "^0.13"
python-dateutil = "^2.8.2"
bleak = "^3.0.2"
PyYAML = "^6.0.1"
rich = "^15.0.0"
aiohttp = "^3.8.5"
# aiohttp's transitive C-extension deps: pinned no lower than the first
# versions with prebuilt Python 3.14 wheels - older pins force a source
# build against CPython C-API internals (_PyArg_ParseStackAndKeywords,
# Py_TRASHCAN_SAFE_BEGIN/END, etc.) that 3.14 removed.
multidict = ">=6.7.1"
yarl = ">=1.24.2"
frozenlist = ">=1.8.0"
pyside6 = "^6.6.1"
pyside6-essentials = "^6.6.1"
appdirs = "^1.4.4"
tomli = "^2.0.1"
tomli-w = "^1.0.0"
sortedcontainers = "^2.4.0"
dotty-dict = "^1.3.1"
sentry-sdk = { version = "^1.29.2", optional = true, extras = ["aiohttp"] }
logtail-python = "^0.2.6"
pyinstaller = { version = "^6.0", optional = true }
certifi = {version = "^2022.12.7", optional = true}
sentinel = {extras = ["varname"], version = "^1.0.0"}
pirateweatherlib = "^0.4.0"
deepmerge = "^2.1.0"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/noblecloud/LevityDash/issues"
"Documentation" = "https://levitydash.app/#/getting-started"
"Discussions" = "https://github.com/noblecloud/LevityDash/discussions"

[tool.poetry.group.dev.dependencies]
WeatherUnits = { develop = true, path = "../WeatherUnits" }
python-semantic-release = "^7.34.6"
pytest = ">=8.0"

[tool.poetry.group.build-to-app.dependencies]
pyinstaller = "^6.0"
certifi = "^2022.12.7"

[tool.poetry.group.pycharm.dependencies]
pydevd-pycharm = "^222.4554.11"

[tool.poetry.group.monitoring.dependencies]
sentry-sdk = "^1.29.2"
logtail-python = "^0.2.6"

[tool.poetry.group.docs.dependencies]
sphinx = "^7.1.2"
pdoc3 = "^0.10.0"
numpydoc = "^1.5.0"

[tool.poetry.extras]
monitoring = ["sentry-sdk", "logtail-python"]
build = ["pyinstaller", "certifi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# QT_QPA_PLATFORM=offscreen and LEVITYDASH_CONFIG_DEBUG=1 are set in
# tests/conftest.py before any Qt import (no pytest-env dependency needed).
markers = [
	"unwired: behavior the size-group engine does not yet implement (xfail until wired)",
]
filterwarnings = [
	"ignore::DeprecationWarning",
]

[build-system]
requires = ["poetry-core>=1.1.0"]
build-backend = "poetry.core.masonry.api"

[tool.semantic_release]
version_variable = [
	"pyproject.toml:version",
	"src/LevityDash/__init__.py:__version__",
]