# One coming hour, read off the forecast with `at()`: how far on it is, the temperature, the chance of rain, the
# rain rate and the gust. A horizontal stack of these with `defaultType: value-stack` is an hour-by-hour table, the
# same idea as `day-column` for a week. `offset` is how far on from now ("3h"); give the matching `label`.
doc: "One hour of the hourly table: temperature, chance of rain, rain rate, gust"
props:
  label: {default: +1h, type: text, doc: The name over the column}
  offset: {default: 1h, type: text, doc: "How far on from now, such as 3h"}
  temp: {default: 'at(environment.temperature.temperature, $offset)', type: key, doc: The temperature}
  feels: {default: 'at(environment.temperature.feelsLike, $offset)', type: key, doc: The temperature it feels like}
  chance: {default: 'at(environment.precipitation.probability, $offset)', type: key, doc: The chance of rain}
  rain: {default: 'at(environment.precipitation.precipitation, $offset)', type: key, doc: The rain rate}
  gust: {default: 'at(environment.wind.speed.gust, $offset)', type: key, doc: The gust}
  headGroup: {default: global.head, type: text, doc: "Size group of the hour names; the default spans the whole dashboard"}
template:
  items:
    - {type: text, text: $label, font: $display, color: $text, alignment: Center, matchingGroup: {group: $headGroup, matchAll: true}}
    - {type: realtime.text, key: $temp, title: {text: Temp}, display: {precision: 0, valueLabel: {color: $accent}}}
    - {type: realtime.text, key: $feels, title: {text: Feels}, display: {precision: 0}}
    - {type: realtime.text, key: $chance, title: {text: Rain}, display: {precision: 0, valueLabel: {color: $info}}}
    - {type: realtime.text, key: $rain, title: {text: Rate in/hr}, display: {precision: 1, unitPosition: Hidden, valueLabel: {color: $info}}}
    - {type: realtime.text, key: $gust, title: {text: Gust mph}, display: {precision: 0, unitPosition: Hidden, valueLabel: {color: $warn}}}
