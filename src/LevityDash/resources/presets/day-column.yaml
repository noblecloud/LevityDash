# One coming day, read off the daily keys with `at()`: its name, the high and low, the rain, the gust and
# the wind's heading. Seven of these in a horizontal stack with `defaultType: value-stack` make a week
# table. `offset` is how far on from now ("1d" is tomorrow). Each reading is a property whose default reads
# the daily key at `offset`; for today give the plain key (`high: environment.temperature.high`), which
# needs no `at()`.
doc: "One day of the week table: high, low, rain, gust, wind heading"
props:
  label: {default: Tomorrow, type: text, doc: The name over the column}
  offset: {default: 1d, type: text, doc: "How far on from now, such as 2d"}
  high: {default: 'at(environment.temperature.high, $offset)', type: key, doc: The daily high}
  low: {default: 'at(environment.temperature.low, $offset)', type: key, doc: The daily low}
  rain: {default: 'at(environment.precipitation.daily, $offset)', type: key, doc: The rain for the day}
  gust: {default: 'at(environment.wind.speed.gustMax, $offset)', type: key, doc: The day's strongest gust}
  heading: {default: 'at(environment.wind.direction.dominant, $offset)', type: key, doc: Where the wind comes from}
  high_title: {default: {text: High}, doc: "The label beside the high, written as a title; false for none, so a table can name its rows once"}
  low_title: {default: {text: Low}, doc: "The label beside the low; false for none"}
  rain_title: {default: {text: Rain in}, doc: "The label beside the rain; false for none"}
  gust_title: {default: {text: Gust mph}, doc: "The label beside the gust; false for none"}
  heading_title: {default: {text: From}, doc: "The label beside the wind heading; false for none"}
  numberAlign: {default: decimal, type: text, doc: "How the readings line up in the column: decimal, end or none (see reading-list)"}
  headGroup: {default: global.head, type: text, doc: "Size group of the day names; the default spans the whole dashboard"}
template:
  shared:
    display:
      valueLabel: {number-align: $numberAlign}
  items:
    - {type: text, text: $label, font: $display, color: $text, alignment: Center, matchingGroup: {group: $headGroup, matchAll: true}}
    - {type: realtime.text, key: $high, title: $high_title, display: {precision: 0, valueLabel: {color: $bad}}}
    - {type: realtime.text, key: $low, title: $low_title, display: {precision: 0, valueLabel: {color: $info}}}
    - {type: realtime.text, key: $rain, title: $rain_title, display: {precision: 2, unitPosition: Hidden, valueLabel: {color: $info}}}
    - {type: realtime.text, key: $gust, title: $gust_title, display: {precision: 0, unitPosition: Hidden, valueLabel: {color: $warn}}}
    - {type: realtime.text, key: $heading, title: $heading_title, display: {precision: 0}}
