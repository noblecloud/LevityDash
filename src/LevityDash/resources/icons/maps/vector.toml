[vector]
prefix = "vec"
name = "Levity Vectors"
default = "line"

# A vector pack: path data instead of a font. `stroke` is in viewBox units and is baked
# into the outline, so a glyph still fills with one brush (the item's colour).
[vector.line]
viewBox = "0 0 24 24"
stroke = 2

