[Location]
timezone =
latitude =
longitude =

[Display]
dashboard = default.levity
frontend = Qt
fullscreen = False
display = smallest
width = 8.56in
height = 5.35in
liveUpdateTimedeltas = True

[QtOptions]
openGL = true
antialiasing = true
antialiasingSamples = 8
maxTextureSize = 10mb
pixmapCacheSize = 200mb
status-bar = true

[MenuBar]
fullscreen = hidden
normal = show
delay = 1.0

[Fonts]
default = Nunito
default.weight = Medium
compact = Nunito
compact.weight = Medium
title = Roboto
title.weight = Light

[Logging]
level = INFO
verbosity = 3
encoding = utf-8
logTimeFormat = %m/%d/%y %H:%M:%S
logFileWidth = 120

maxLogFolderSize = 200mb
maxLogAge = 7 days
rolloverSize = 10mb
rolloverCount = 5

prettyErrors = False
maxPrettyErrorsFolderSize = 50mb

;WeatherUnits Section
[Units]
wind = mph
temperature = f
precipitationRate = inch/*
precipitationHourly = inch/hr
precipitation = inch
pressure = inHg
density = lbs/ft^3
pollutionDensity = ug/m
length = mi

[UnitDefaults]
precision = 1
digit_budget = 3
unit =
suffix =
unit_symbol =
unit_spacer = True
title =
exp = 1
slide = False
show_unit = True
shorten = False
k_separator = False
combine_unit_and_suffix = False
force_precision = False

[UnitProperties]
Tiny = precision=3, digit_budget=4
Small = precision=2, digit_budget=4
Medium = precision=1, digit_budget=3
Large = precision=1, digit_budget=3
Huge = precision=2, digit_budget=3
pressure = precision=2, digit_budget=4
mmHg = precision=2, digit_budget=4, force_precision=True
inHg = precision=2, digit_budget=4, force_precision=True
voltage = precision=2, digit_budget=3, unit_spacer=False
UVI = unit_spacer=False
density = precision=3, digit_budget=4, force_precision=True
time = precision=0, digit_budget=2, unit_spacer=False, shorten=True
temperature = precision=0, digit_budget=3, unit_spacer=False, shorten=False, k_separator=True, show_unit=False
direction = cardinal=True, degrees=False, size_hint=WW, shorten=True, digit_budget=3
strikes = precision=0, digit_budget=2
illuminance = digit_budget=3, shorten=True
wind = precision=1, digit_budget=2
# precision=2 in a 2-digit budget only fits without the leading zero, which
# leadingZero's default ('auto') handles on its own: 0.01 renders '.01', while
# 0.5 keeps its zero since it fits either way. Force it with leading_zero=True
# or =False if a panel wants one or the other unconditionally.
precipitationRate = precision=2, digit_budget=2
precipitation = precision=2, digit_budget=2
humidity = precision=0, digit_budget=2
