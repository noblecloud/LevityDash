# Scenario for presets/uv-or-rain.levity: Dry: UV 10, no rain.
# Render both and compare: the slot shows UV when dry and rain detail while it rains.
name: uv-or-rain-dry
description: 'Dry: UV 10, no rain.'
keys:
  environment.temperature.temperature:
    value: 98
    unit: f
    series: [74, 73, 72, 72, 71, 71, 73, 77, 82, 87, 91, 94, 96, 98, 99, 99, 97, 94, 90, 86, 83, 80, 77, 75]
  environment.humidity.humidity:
    value: 31
    unit: '%'
    series: [62, 65, 67, 68, 70, 70, 66, 58, 50, 43, 38, 34, 32, 31, 30, 30, 32, 36, 42, 48, 52, 56, 59, 61]
  environment.precipitation.precipitation:
    value: 0
    unit: [mm, hr]
    type: precipitationHourly
  environment.light.uvi: {value: 10, unit: uvi, type: index, title: UV Index}
  environment.precipitation.daily:
    value: 0
    unit: [mm, day]
    type: precipitationDaily
    title: Precipitation Daily
