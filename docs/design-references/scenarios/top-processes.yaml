# Not weather: the busiest processes on a host, ranked by CPU.
#
# A ranked list publishes one key per slot rather than one key per process:
# `system.process.top.N.*` is whichever process ranks Nth right now, so a panel
# binds to slots and never to process names. A real source (psutil, or a
# remote agent) would re-rank on every poll and publish the same keys.
#
# Load it for a render with:
#   .venv/bin/python src/LevityDash/devtools/render_dashboard.py out.png \
#       --levity docs/design-references/presets/process-table.levity --scenario top-processes
#
# `str` values are text with no unit. Percentages are fractions (0.458 is 45.8 %):
# WeatherUnits reads a value above 1 as a whole percent and one at or below 1 as
# a fraction, so 0.1 % written as 0.1 would show as 10 %. How a scenario reads is in
# src/LevityDash/lib/plugins/builtin/Fixture.py.
name: top-processes
description: 312 processes, six ranked by CPU, from postgres at 45.8 % down to redis at 0.1 %.
keys:
  system.process.count: {value: 312, unit: int, title: Processes}
  system.process.top.1.name: {value: postgres, unit: str, title: Name}
  system.process.top.1.pid: {value: 1182, unit: int, title: PID}
  system.process.top.1.cpu: {value: 0.458, unit: '%', title: CPU}
  system.process.top.1.memory: {value: 0.18, unit: '%', title: Mem}
