# A hot, dry, clear afternoon in July: about 3 pm, near the daily high.
#
# Load it for a render with:
#   poetry run python src/LevityDash/devtools/render_widget.py \
#       --levity frag.levity --scenario hot-clear-day --name gauge --out out.png
#
# How a scenario reads is in src/LevityDash/lib/plugins/builtin/Fixture.py.
# Units are stated per key, so the numbers are the ones a person would say.
# `series` is today's 24 hourly values, 00:00 to 23:00 local.
name: hot-clear-day
description: Hot, dry, clear. High pressure, light south-west wind, UV 10.
keys:
  environment.temperature.temperature:
    value: 98
    unit: f
    series: [74, 73, 72, 72, 71, 71, 73, 77, 82, 87, 91, 94, 96, 98, 99, 99, 97, 94, 90, 86, 83, 80, 77, 75]
  environment.temperature.feelsLike:
    value: 103
    unit: f
    series: [75, 74, 73, 73, 72, 72, 74, 79, 85, 91, 96, 100, 102, 103, 104, 104, 101, 97, 92, 88, 85, 82, 79, 77]
  environment.temperature.dewpoint:
    value: 60
    unit: f
  environment.temperature.high:
    value: 99
    unit: f
  environment.temperature.low:
    value: 71
    unit: f
  environment.humidity.humidity:
    value: 31
    unit: '%'
    series: [62, 65, 67, 68, 70, 70, 66, 58, 50, 43, 38, 34, 32, 31, 30, 30, 32, 36, 42, 48, 52, 56, 59, 61]
  environment.pressure.pressure:
    value: 1015
    unit: hPa
    series: [1014, 1014, 1013, 1013, 1013, 1013, 1014, 1014, 1014, 1014, 1014, 1014, 1014, 1015, 1015, 1015, 1015, 1015, 1015, 1016, 1016, 1016, 1016, 1016]
  environment.wind.speed.speed:
    value: 7
    unit: [mi, hr]
    type: wind
    series: [2, 2, 1, 1, 2, 2, 3, 4, 5, 6, 7, 8, 8, 7, 7, 8, 7, 6, 5, 4, 3, 3, 2, 2]
  environment.wind.speed.gust:
    value: 13
    unit: [mi, hr]
    type: wind
  environment.wind.direction.direction:
    value: 215
    unit: º
    type: direction
  environment.clouds.cover.cover:
    value: 4
    unit: '%c'
    type: cloudcover
  environment.precipitation.precipitation:
    value: 0
    unit: [mm, hr]
    type: precipitationHourly
  environment.light.uvi:
    value: 10
    unit: uvi
    type: index
    title: UV Index
