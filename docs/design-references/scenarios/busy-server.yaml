# Not weather: a host under load. System metrics published under their own keys,
# to check that a gauge design does not lean on weather units or weather ranges.
#
# Load it for a render with:
#   poetry run python src/LevityDash/devtools/render_widget.py \
#       --levity frag.levity --scenario busy-server --name gauge --out out.png
#
# Every key here is new to the schema, so each needs a `unit`. `int` is a plain
# number with no unit symbol. How a scenario reads is in
# src/LevityDash/lib/plugins/builtin/Fixture.py.
name: busy-server
description: CPU 87 %, memory 72 %, disk 91 % full, 74 C core, a laptop at 23 % charge, a house exporting power.
keys:
  system.cpu.load:
    value: 87
    unit: '%%'
    title: CPU
    series: [12, 10, 9, 9, 11, 14, 22, 38, 55, 61, 58, 64, 70, 72, 69, 75, 81, 84, 90, 93, 91, 88, 87, 85]
  system.memory.used:
    value: 72
    unit: '%%'
    title: Memory
    series: [40, 40, 41, 41, 42, 44, 48, 52, 58, 61, 62, 64, 66, 67, 68, 69, 70, 70, 71, 71, 72, 72, 72, 72]
  system.disk.used:
    value: 91
    unit: '%%'
    title: Disk
  system.cpu.temperature:
    value: 74
    unit: c
    title: Core Temperature
    series: [41, 40, 40, 40, 41, 43, 48, 54, 60, 62, 61, 64, 67, 69, 68, 70, 72, 73, 75, 76, 75, 74, 74, 73]
  system.battery.charge:
    value: 23
    unit: '%bat'
    title: Battery
  system.network.down:
    value: 412
    unit: int
    title: Download (Mbit/s)
  system.power.net:
    value: -3.4
    unit: int
    title: Net Power (kW, negative is export)
