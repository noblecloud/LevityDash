<style>

	:root {
		--base-font-family: "Nunito", -apple-system, BlinkMacSystemFont, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
		--base-font-size: 16px;
		--base-font-weight: normal;
		--base-line-height: 1.7;

		--cover-margin: 0em;
		--cover-padding: 0em;
		--cover-max-width: 100vw;
		--cover-min-width: 100vw;
		--cover-height: unset;
		--cover-max-height: unset;
		--cover-min-height: 10vh;

		--cover-background-image:
			radial-gradient(880px 520px at 80% -8%, rgba(196, 206, 255, 0.6), rgba(196, 206, 255, 0) 62%),
			linear-gradient(to bottom,
				#d2ddfb 0%,
				#d9e4fb 12%,
				#e3edfb 40%,
				#ecf2fd 70%,
				#f6fafe 100%
			);

		--cover-background-mask-opacity: 0;
		--cover-background-position: center center;

		--cover-border-inset: 0;
		--cover-border-width: 0;

		--cover-heading-font-size: unset;
		--cover-heading-font-size-min: unset;
		--cover-heading-font-size-max: unset;
	}

	.cover {
		min-height: auto;
		padding-top: 2.2em;
		padding-bottom: 1.4em;
		color: #1e2a3a;
	}

	.first-container {
		max-height: 100%;
		padding: 4% 0 3%;
	}

	.cover h1 {
		color: #1e2a3a;
		font-family: "Nunito", -apple-system, sans-serif;
		overflow: visible;
		text-overflow: ellipsis;
		font-size: clamp(2.2em, 9.5vh, 92px);
		font-weight: 800;
		line-height: 1.05;
		padding-bottom: .18em;
		letter-spacing: -0.02em;
	}

	.dash {
		background: var(--dash-gradient, linear-gradient(100deg, #f6a121 0%, #ef7f3a 55%, #ef6f57 100%));
		-webkit-background-clip: text;
		background-clip: text;
		-webkit-text-fill-color: transparent;
		font-weight: 800;
	}

	.cover h2 {
		font-weight: 600;
		font-family: "Nunito", -apple-system, sans-serif;
		font-size: clamp(1em, 2.9vh, 27px);
		padding-bottom: .5em;
		margin: 0.2em auto 0;
		color: #45566b !important;
	}

	.cover picture {
		display: inline-block;
		perspective: 1600px;
	}

	.screenshotAlpha {
		background-color: transparent;
		padding: 0;
		border: none;
		display: block;
		margin: 1.2em auto 0.4em;
		border-radius: 16px;
		box-shadow:
			0 40px 70px -28px rgba(28, 52, 90, 0.5),
			0 16px 30px -18px rgba(47, 143, 216, 0.28);
		transform-origin: 50% 50% -340px;
	}

	@media (prefers-reduced-motion: reduce) {
		.screenshotAlpha { animation: none; transform: none !important; }
	}

	.cover small.mono {
		display: inline-block;
		max-width: 46em;
		margin-top: 1em;
		color: #6d7988;
		line-height: 1.5;
	}

	.cover small.mono strong {
		color: #45566b;
	}

	.macOSWindowDark {
		background-color: rgba(255, 255, 255, 0.6);
		border-radius: 16px;
		box-shadow: 0 30px 60px -24px rgba(28, 52, 90, 0.35);
		padding: 1em;
	}

	@media (prefers-color-scheme: dark) {
		:root {
			--cover-background-image:
				radial-gradient(820px 470px at 84% -4%, rgba(255, 178, 84, 0.30), transparent 58%),
				linear-gradient(to bottom,
					#1c1811 0%,
					#171420 26%,
					#11101b 55%,
					#0c0d16 82%,
					#0b0d13 100%
				);
		}

		.cover { color: #eef1f7; }
		.cover h1 { color: #eef1f7; }
		.cover h2 { color: #b7bfce !important; }
		.cover small.mono { color: #868fa0; }
		.cover small.mono strong { color: #c3cad7; }

		.screenshotAlpha {
			box-shadow:
				0 40px 80px -30px rgba(0, 0, 0, 0.85),
				0 0 0 1px rgba(255, 255, 255, 0.06),
				0 0 70px rgba(255, 180, 84, 0.10);
		}
	}

</style>

<h1>
	Levity<span class="dash">Dashboard</span>
</h1>
<h2>
	A lightweight, easy to use, desktop native, multi-source dashboard for macOS, Windows and Linux
</h2>
<picture>
	<source srcset="_images/screenshot.webp" type="image/webp">
	<source srcset="_images/screenshot.avif" type="image/avif">
	<img alt="Screenshot" class="screenshotAlpha" src="_images/screenshot.png">
</picture>
<small class="mono">LevityDash <strong>v0.3.0-beta.1</strong> is currently <strong>in beta</strong> — expect rough edges. Requires <strong>Python 3.13–3.14</strong> (<strong>3.14</strong> recommended).</small>

<script>
(function() {
	var img = document.querySelector('.screenshotAlpha');
	if (!img) return;

	var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
	if (mq.matches) return;

	var state = { ty: 0, rx: 0, ry: 0 };

	function rand(max) {
		return (Math.random() * 2 - 1) * max;
	}

	function next() {
		var dur = 6000 + Math.random() * 10000;
		var ty = rand(11);
		var rx = rand(3.4);
		var ry = rand(3.4);

		var from = 'translateY(' + state.ty + 'px) rotateX(' + state.rx + 'deg) rotateY(' + state.ry + 'deg)';
		var to = 'translateY(' + ty + 'px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';

		state = { ty: ty, rx: rx, ry: ry };

		var anim = img.animate([
			{ transform: from },
			{ transform: to }
		], {
			duration: dur,
			easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)',
			fill: 'forwards'
		});

		anim.onfinish = next;
	}

	next();

	mq.addEventListener('change', function(e) {
		if (e.matches) {
			img.getAnimations().forEach(function(a) { a.cancel(); });
			img.style.transform = 'none';
		} else {
			next();
		}
	});
})();
</script>
