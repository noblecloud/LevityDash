name: Set up LevityDash
description: Python 3.14, Qt runtime libraries, en_US locale, WeatherUnits beside the repo, Poetry install into LevityDash/.venv. Expects the repo checked out at ./LevityDash.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: System libraries and locale
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
          libglib2.0-0 libxcb-cursor0 locales fonts-dejavu-core
        sudo locale-gen en_US.UTF-8
    - name: WeatherUnits (path dependency)
      shell: bash
      run: git clone --depth 1 --branch dev https://github.com/noblecloud/WeatherUnits.git WeatherUnits
    - name: Install dependencies
      shell: bash
      working-directory: LevityDash
      run: |
        python -m venv .venv
        python -m pip install -q poetry
        VIRTUAL_ENV="$PWD/.venv" poetry install --no-interaction
