<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>LevityWeb</title>
	<style>
		@font-face {
			font-family: 'Nunito';
			src: url('/fonts/Nunito-VariableFont_wght.ttf') format('truetype');
			font-weight: 200 1000;
		}
		@font-face {
			font-family: 'Roboto';
			src: url('/fonts/Roboto-Regular.ttf') format('truetype');
			font-weight: 400;
		}
		@font-face {
			font-family: 'Roboto';
			src: url('/fonts/Roboto-Medium.ttf') format('truetype');
			font-weight: 500;
		}
		@font-face {
			font-family: 'Roboto';
			src: url('/fonts/Roboto-Bold.ttf') format('truetype');
			font-weight: 700;
		}
		@font-face {
			font-family: 'Roboto';
			src: url('/fonts/Roboto-Light.ttf') format('truetype');
			font-weight: 300;
		}
		@font-face {
			font-family: 'Weather Icons';
			src: url('/fonts/weathericons.ttf') format('truetype');
		}
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #05070d;
		}
		#stage {
			position: fixed;
			inset: 0;
			width: 100vw;
			height: 100vh;
			display: block;
			cursor: default;
		}
		#hud {
			position: fixed;
			top: 10px;
			right: 12px;
			font: 11px/1.4 system-ui, sans-serif;
			color: rgba(255, 255, 255, 0.55);
			text-align: right;
			pointer-events: none;
			user-select: none;
			text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
		}
		#hud .dot {
			display: inline-block;
			width: 8px;
			height: 8px;
			border-radius: 50%;
			margin-left: 6px;
			vertical-align: 1px;
		}
		#hud .dot.connected   { background: #3ddc84; box-shadow: 0 0 6px #3ddc84; }
		#hud .dot.connecting  { background: #f5b942; box-shadow: 0 0 6px #f5b942; animation: blink 1s infinite; }
		#hud .dot.disconnected{ background: #e5484d; box-shadow: 0 0 6px #e5484d; }
		@keyframes blink { 50% { opacity: 0.3; } }
	</style>
</head>
<body>
	<canvas id="stage"></canvas>
	<div id="hud"><span id="connLabel">connecting</span><span id="connDot" class="dot connecting"></span></div>
	<script type="module" src="/src/main.ts"></script>
</body>
</html>
